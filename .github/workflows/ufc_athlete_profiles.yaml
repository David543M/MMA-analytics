job:
  name: ufc_athlete_profile_sync
  enabled: true
  batch_size: 50
  delay_ms: 1200
  timeout_ms: 30000
  headless: true

source:
  profile_url_template: "https://www.ufc.com/athlete/{slug}"

selectors:
  info_term: "dt"
  info_value: "dd"

  stats_section_heading:
    - "Stats & Records"
    - "Stats and Records"

  qa_question_candidates:
    - "When and why did you start training for fighting?"
    - "What professional titles have you held?"
    - "Any accomplishments in amateur combat sports?"
    - "What has been your toughest fight to date and why?"
    - "Who is your favorite fighter and why?"
    - "What was your job before you started fighting?"
    - "Personal Life/Background"

  fight_history_row: ".c-listing-fight__content, .c-card-event--athlete-results"
  fight_history_text_fallback: "body"

mapping:
  info:
    status: ["Status"]
    place_of_birth: ["Place of Birth"]
    trains_at: ["Trains at", "Training"]
    fighting_style: ["Fighting style"]
    age: ["Age"]
    height: ["Height"]
    weight: ["Weight"]
    octagon_debut: ["Octagon Debut"]
    reach: ["Reach"]
    leg_reach: ["Leg reach", "Leg Reach"]

  derived_bullets:
    pro_since: ["Pro since"]
    wins_by_ko: ["wins by KO", "wins by Knockout"]
    wins_by_submission: ["wins by submission"]
    first_round_finishes: ["first-round finishes", "first round finishes"]
    amateur_record: ["amateur record"]

  stats_records:
    sig_strikes_landed: ["Sig. Strikes Landed"]
    sig_strikes_attempted: ["Sig. Strikes Attempted"]
    takedowns_landed: ["Takedowns Landed"]
    takedowns_attempted: ["Takedowns Attempted"]
    slpm: ["Sig. Str. Landed Per Min", "Sig. Str. Landed Per Min."]
    sapm: ["Sig. Str. Absorbed Per Min", "Sig. Str. Absorbed Per Min."]
    td_avg: ["Takedown avg Per 15 Min", "Takedown avg"]
    sub_avg: ["Submission avg Per 15 Min", "Submission avg"]

supabase:
  url_env: "SUPABASE_URL"
  service_role_key_env: "SUPABASE_SERVICE_ROLE_KEY"

targets:
  profile_table: "fighter_profiles"
  facts_table: "fighter_ufc_facts"
  qa_table: "fighter_ufc_qa"
  stats_table: "fighter_ufc_stats"
  fights_table: "fighter_ufc_fight_history"
